<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить заказчика</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            max-width: 550px;
            margin: 0 auto;
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .card-header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            padding: 10px 16px;
        }
        .card-header h5 {
            margin: 0;
            font-size: 1.1rem;
        }
        .card-body {
            padding: 20px;
        }
        .form-label {
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .form-control, .form-select {
            font-size: 0.85rem;
            padding: 6px 10px;
        }
        .btn-sm {
            padding: 6px 16px;
        }
        .mb-3 {
            margin-bottom: 14px !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow">
            <div class="card-header text-white">
                <h5 class="mb-0">
                    <i class="bi bi-building"></i> Новый заказчик
                </h5>
            </div>
            <div class="card-body">
                <form method="post" id="customerForm">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Название *</label>
                        {{ form.name }}
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">ИНН</label>
                            {{ form.inn }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">КПП</label>
                            {{ form.kpp }}
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">ОГРН</label>
                        {{ form.ogrn }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Юр. адрес</label>
                        {{ form.address }}
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Телефон</label>
                            {{ form.phone }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            {{ form.email }}
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Контактное лицо</label>
                        {{ form.contact_person }}
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            {{ form.is_active }}
                            <label class="form-check-label">Активен</label>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Примечания</label>
                        {{ form.notes }}
                    </div>
                    
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success flex-grow-1">
                            <i class="bi bi-save"></i> Сохранить
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="window.close()">
                            <i class="bi bi-x-circle"></i> Закрыть
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="text-center mt-3">
            <small class="text-muted">
                <i class="bi bi-info-circle"></i> 
                После сохранения закройте эту вкладку и обновите страницу с договором (F5)
            </small>
        </div>
    </div>
    
    <script>
        document.getElementById('customerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const form = this;
            const formData = new FormData(form);
            
            fetch('', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('✅ Заказчик "' + data.name + '" успешно добавлен!');
                    window.close();
                } else if (data.errors) {
                    let errorMsg = 'Ошибка:\n';
                    for (let field in data.errors) {
                        errorMsg += `- ${field}: ${data.errors[field]}\n`;
                    }
                    alert(errorMsg);
                } else {
                    alert('Ошибка при сохранении');
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                alert('Ошибка при сохранении');
            });
        });
    </script>
</body>
</html>
