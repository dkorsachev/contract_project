<form method="post" id="modal-form" action="{{ request.path }}">
    {% csrf_token %}
    
    <div class="text-center py-4">
        <i class="bi bi-exclamation-triangle-fill" style="font-size: 4rem; color: #dc3545;"></i>
        <h4 class="mt-3">Подтверждение удаления</h4>
        <p class="text-muted">Вы действительно хотите удалить договор?</p>
        <div class="alert alert-warning">
            <strong>{{ contract.number }}</strong><br>
            {{ contract.get_customer_display }}<br>
            от {{ contract.date|date:"d.m.Y" }}
        </div>
        <p class="text-danger small">Это действие нельзя отменить!</p>
    </div>
    
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="bi bi-x-circle"></i> Отмена
        </button>
        <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash"></i> Удалить
        </button>
    </div>
</form>
