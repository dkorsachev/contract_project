<form method="post" id="modal-form" action="{{ request.path }}">
    {% csrf_token %}
    
    <div class="text-center py-4">
        <i class="bi bi-exclamation-triangle-fill" style="font-size: 4rem; color: #dc3545;"></i>
        <h4 class="mt-3">Подтверждение удаления</h4>
        <p class="text-muted">Вы действительно хотите удалить сотрудника?</p>
        <div class="alert alert-warning">
            <strong>{{ employee.full_name }}</strong><br>
            <span class="badge bg-{% if employee.position == 'geodesist' %}info{% elif employee.position == 'cadastral_engineer' %}primary{% elif employee.position == 'designer' %}success{% else %}secondary{% endif %}">
                {{ employee.get_position_display }}
            </span>
        </div>
        <p class="text-danger small">
            <i class="bi bi-exclamation-circle"></i> 
            Внимание! Удаление сотрудника может затронуть связанные договоры.
        </p>
    </div>
    
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="bi bi-x-circle"></i> Отмена
        </button>
        <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash"></i> Удалить
        </button>
    </div>
</form>
